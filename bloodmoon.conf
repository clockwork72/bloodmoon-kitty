# vim:ft=kitty
#
# name: Bloodmoon
# author: bloodmoon palette for clockwork
# description: neo-brutalist / pixel-tech dark red theme.
#              Near-black background, warm off-white text, blood-red accents.
#              Non-red ANSI slots are muted so red stays dominant while syntax
#              remains legible.

# ─── Core palette ─────────────────────────────────────────────────────────

background            #0d0608
foreground            #e8d5d0
selection_background  #5a0d0d
selection_foreground  #ffffff
url_color             #ff4d4d
cursor                #ff1744
cursor_text_color     #0d0608

# normal (ANSI 0-7)
color0 #0d0608
color1 #c1121f
color2 #788a3c
color3 #d4a04c
color4 #5a6f9c
color5 #9d1f33
color6 #d6604d
color7 #d7c9c9

# bright (ANSI 8-15)
color8  #3d2828
color9  #ff2d4d
color10 #a3b86c
color11 #ffc857
color12 #7d92be
color13 #ff4d6d
color14 #ff8a6a
color15 #faf0f0

# Marks
mark1_foreground #0d0608
mark1_background #ff1744
mark2_foreground #0d0608
mark2_background #ffc857
mark3_foreground #e8d5d0
mark3_background #5a0d0d

# ─── Window frame ─────────────────────────────────────────────────────────
# Brutalist edge: hard 2pt red border, tight padding, no titlebar fluff.

hide_window_decorations  titlebar-only
window_padding_width     8
single_window_padding_width -1
window_margin_width      0
window_border_width      2pt
draw_minimal_borders     no
placement_strategy       top-left
resize_in_steps          no
confirm_os_window_close  0
remember_window_size     yes
initial_window_width     110c
initial_window_height    32c

active_border_color   #c1121f
inactive_border_color #2a0a0a
bell_border_color     #ff1744

# ─── Tab bar ──────────────────────────────────────────────────────────────
# Sharp separator style, no slants or gradients. Active tab is a flat red
# block — the visual anchor of the window.

tab_bar_edge        top
tab_bar_style       separator
tab_bar_align       left
tab_separator       " ▌ "
tab_bar_min_tabs    1
tab_bar_margin_width 0
tab_bar_margin_height 0 0
tab_title_template          "{fmt.fg._3d2828}▍{fmt.fg.default} {index}·{title} "
active_tab_title_template   "{fmt.fg._0d0608}▍{fmt.fg.default} {index}·{title} "
active_tab_font_style   bold
inactive_tab_font_style normal
tab_activity_symbol  ●

tab_bar_background      #050203
active_tab_background   #c1121f
active_tab_foreground   #0d0608
inactive_tab_background #2a0a0a
inactive_tab_foreground #8a6a6a

# ─── Cursor ───────────────────────────────────────────────────────────────
# Block, no blink, with a short red trail for that "moving pixel" feel.

cursor_shape                 block
cursor_blink_interval        0
shell_integration            enabled no-cursor
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# ─── Bell & visuals ───────────────────────────────────────────────────────

enable_audio_bell    no
visual_bell_duration 0.12
visual_bell_color    #ff1744
window_alert_on_bell yes
bell_on_tab          "🜂 "

# ─── URLs ─────────────────────────────────────────────────────────────────

url_style            straight
underline_hyperlinks always
detect_urls          yes
show_hyperlink_targets yes

# ─── Keybindings ──────────────────────────────────────────────────────────

map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# ─── Misc polish ──────────────────────────────────────────────────────────

background_opacity   1.0
mouse_hide_wait      2.0
copy_on_select       clipboard
strip_trailing_spaces smart
scrollback_lines     20000
wheel_scroll_multiplier 4.0
disable_ligatures    cursor
